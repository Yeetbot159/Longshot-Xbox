# Builds the game-free Xbox packages. Tag xbox-vMAJOR.MINOR.PATCH to publish one prerelease
# containing the launcher, the capability probe, and their shared public signing certificate.
name: Xbox packages

on:
  push:
    branches: [main]
    paths: ['xbox/**', 'host/uwp/**', 'gpu/**', 'nx2/**', 'third_party/a64-kit/lift/a64emit.py', 'tests/test_a64emit_memory.py', 'tests/test_xbox_build.py', 'tests/test_xbox_tool_package.py', '.github/workflows/xbox.yml']
    tags: ['xbox-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_NAME -match '^xbox-v(\d+)\.(\d+)\.(\d+)$') {
            $v = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          } else {
            $v = '0.0.0.0'
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: llvm-mingw runtime for Xbox game modules
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo mstorsjo/llvm-mingw --pattern '*-ucrt-x86_64.zip' --dir $env:RUNNER_TEMP
          $zip = Get-ChildItem $env:RUNNER_TEMP -Filter '*-ucrt-x86_64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'llvm-mingw release archive was not downloaded' }
          Expand-Archive $zip.FullName -DestinationPath $env:RUNNER_TEMP
          $dir = Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'llvm-mingw-*' | Select-Object -First 1
          if (-not $dir) { throw 'llvm-mingw archive did not contain its toolchain directory' }
          "LONGSHOT_MINGW=$($dir.FullName)" >> $env:GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Renderer headers
        shell: pwsh
        run: |
          $cpm = Join-Path $env:RUNNER_TEMP 'longshot-cpm'
          New-Item -ItemType Directory -Force $cpm | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $cpm 'vulkanheaders'), (Join-Path $cpm 'spirv-headers'), (Join-Path $cpm 'vulkanmemoryallocator') | Out-Null
          git clone --quiet --depth 1 --branch v1.4.345 https://github.com/KhronosGroup/Vulkan-Headers.git (Join-Path $cpm 'vulkanheaders\v1.4.345')
          git clone --quiet --depth 1 --branch vulkan-sdk-1.4.341.0 https://github.com/KhronosGroup/SPIRV-Headers.git (Join-Path $cpm 'spirv-headers\vulkan-sdk-1.4.341.0')
          git clone --quiet --depth 1 --branch v3.3.0 https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git (Join-Path $cpm 'vulkanmemoryallocator\v3.3.0')
          "RX_CPM=$cpm" >> $env:GITHUB_ENV
          "OOT_WORK=$(Join-Path $env:RUNNER_TEMP 'longshot-xbox-renderer-work')" >> $env:GITHUB_ENV

      - name: Build Vulkan renderer for Xbox UWP
        shell: pwsh
        run: |
          $env:LONGSHOT_XBOX = '1'
          $env:RX_VK_ONLY = '1'
          $env:LONGSHOT_MINGW = $env:LONGSHOT_MINGW
          python -I nx2/build.py --standalone --jobs 4
          if ($LASTEXITCODE) { throw 'Xbox Vulkan renderer build failed' }

      - name: Mesa Dozen runtime for Xbox package
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa3d-26.2.6-release-msvc.7z'
          Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/mesa3d-26.2.6-release-msvc.7z' -OutFile $archive
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mesa-xbox-runtime'
          New-Item -ItemType Directory -Force $mesaRoot | Out-Null
          7z x $archive "-o$mesaRoot" -y | Out-Null
          if ($LASTEXITCODE) { throw 'Mesa Dozen archive extraction failed' }
          $driver = Get-ChildItem $mesaRoot -Recurse -Filter 'vulkan_dzn.dll' | Select-Object -First 1
          if (-not $driver) { throw 'Mesa archive did not contain vulkan_dzn.dll' }
          $mesa = $driver.Directory.FullName
          foreach ($dll in 'dxil.dll', 'vulkan_dzn.dll') {
            if (-not (Test-Path (Join-Path $mesa $dll))) { throw "Mesa runtime is missing $dll" }
          }
          "LONGSHOT_MESA=$mesa" >> $env:GITHUB_ENV

      - name: Prepare build tools for the console builder
        shell: pwsh
        run: |
          python -m venv (Join-Path $env:RUNNER_TEMP 'longshot-builder-venv')
          $venvPython = Join-Path $env:RUNNER_TEMP 'longshot-builder-venv\Scripts\python.exe'
          & $venvPython -m pip install --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE) { throw 'Builder Python dependencies failed to install' }
          $pythonHome = python -c 'import sys; print(sys.base_prefix)'
          "LONGSHOT_PYTHON_HOME=$pythonHome" >> $env:GITHUB_ENV
          "LONGSHOT_PYTHON_VENV=$(Join-Path $env:RUNNER_TEMP 'longshot-builder-venv')" >> $env:GITHUB_ENV

      - name: Launcher and host checks
        shell: pwsh
        run: |
          foreach ($test in 'test_a64emit_memory.py', 'test_xbox_build.py', 'test_make_game_prepare.py', 'test_make_game_writable.py', 'test_build_cleanup_scope.py', 'test_missing_nup.py', 'test_make_game_cache.py', 'test_work_lock.py', 'test_finish_output.py', 'test_prompt_skip.py', 'test_mem_gate.py', 'test_mem_gate_leases.py', 'test_chunk_split.py') {
            python -I -B "tests/$test"
            if ($LASTEXITCODE) { throw "$test failed" }
          }
          $cxx = Join-Path $env:LONGSHOT_MINGW 'bin\clang++.exe'
          $env:PATH = "$(Join-Path $env:LONGSHOT_MINGW 'bin');$(Join-Path $env:LONGSHOT_MINGW 'x86_64-w64-mingw32\bin');$env:PATH"
          python -I -B tests/test_import_buffer_binding.py --cxx $cxx --headers (Join-Path $env:RX_CPM 'vulkanheaders\v1.4.345\include')
          if ($LASTEXITCODE) { throw 'guest import checks failed' }
          python -I -B tests/test_vma_memory_limit.py --cxx $cxx
          if ($LASTEXITCODE) { throw 'renderer memory boundary checks failed' }
          .\xbox\app\test\run.ps1
          if ($LASTEXITCODE) { throw 'launcher checks failed' }
          .\host\uwp\test\run.ps1
          if ($LASTEXITCODE) { throw 'UWP host checks failed' }

      - name: Build launcher package
        shell: pwsh
        run: .\xbox\app\build.ps1 -Version ${{ steps.version.outputs.version }} -Mingw $env:LONGSHOT_MINGW -Mesa $env:LONGSHOT_MESA -Renderer (Join-Path $env:OOT_WORK 'sa\build\longshot_vk.dll') -IncludeTools -PythonVenv $env:LONGSHOT_PYTHON_VENV -PythonHome $env:LONGSHOT_PYTHON_HOME

      - name: Build probe package
        shell: pwsh
        run: .\xbox\probe\build.ps1 -Version ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: LongshotXbox-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            xbox/out/Longshot.msix
            xbox/out/LongshotXboxProbe.msix
            xbox/out/LongshotXbox.cer

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/xbox-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create $env:REF_NAME xbox/out/Longshot.msix xbox/out/LongshotXboxProbe.msix xbox/out/LongshotXbox.cer `
            --repo '${{ github.repository }}' --title "Longshot Xbox $env:REF_NAME" `
            --notes-file xbox/RELEASE.md --prerelease
