# The Xbox packages, built on GitHub's Windows machines: every push to main that touches xbox/ builds them as an
# artifact; a tag probe-v<major>.<minor>.<patch> also publishes the probe as a release (the .msix and its certificate),
# installed through Device Portal as the Xbox Emulation Hub's ports are. Nothing of the game is built here or anywhere
# in CI: the game module is made on each player's own PC.
name: Xbox packages

on:
  push:
    branches: [main]
    paths: ['xbox/**', 'host/uwp/**', '.github/workflows/xbox.yml']
    tags: ['probe-v*', 'v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  loader:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            xbox
            host/uwp
          fetch-depth: 1

      - name: llvm-mingw (what the game module is built with)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo mstorsjo/llvm-mingw --pattern '*-ucrt-x86_64.zip' --dir $env:RUNNER_TEMP
          $zip = Get-ChildItem $env:RUNNER_TEMP -Filter '*-ucrt-x86_64.zip' | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath $env:RUNNER_TEMP
          $dir = Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'llvm-mingw-*' | Select-Object -First 1
          "LONGSHOT_MINGW=$($dir.FullName)" >> $env:GITHUB_ENV

      - name: The loader's test
        shell: powershell
        run: .\xbox\loader\test\run.ps1

      - name: The Xbox host layer's test (linked against the UWP import library alone)
        shell: powershell
        run: .\host\uwp\test\run.ps1

  launcher:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            xbox
            host/uwp
          fetch-depth: 1

      - name: Version
        id: version
        shell: powershell
        run: |
          $v = '0.0.0.0'
          if ('${{ github.ref }}' -match '^refs/tags/v(\d+)\.(\d+)\.(\d+)$') { $v = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: The launcher's test
        shell: powershell
        run: .\xbox\app\test\run.ps1

      - name: Build the launcher
        shell: powershell
        run: .\xbox\app\build.ps1 -Version ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: Longshot-${{ steps.version.outputs.version }}
          path: |
            xbox/out/Longshot.msix
            xbox/out/LongshotXbox.cer

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' xbox/out/Longshot.msix xbox/out/LongshotXbox.cer `
            --repo '${{ github.repository }}' --title 'Longshot for Xbox ${{ github.ref_name }}' `
            --notes-file xbox/app/RELEASE.md --prerelease

  probe:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: xbox
          fetch-depth: 1

      - name: Version
        id: version
        shell: powershell
        run: |
          $v = '0.0.0.0'
          if ('${{ github.ref }}' -match '^refs/tags/probe-v(\d+)\.(\d+)\.(\d+)$') { $v = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build the probe
        shell: powershell
        run: .\xbox\probe\build.ps1 -Version ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: LongshotXboxProbe-${{ steps.version.outputs.version }}
          path: |
            xbox/out/LongshotXboxProbe.msix
            xbox/out/LongshotXbox.cer

      - name: Release
        if: startsWith(github.ref, 'refs/tags/probe-v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' xbox/out/LongshotXboxProbe.msix xbox/out/LongshotXbox.cer `
            --repo '${{ github.repository }}' --title 'Longshot Xbox Probe ${{ github.ref_name }}' `
            --notes-file xbox/probe/RELEASE.md --prerelease
